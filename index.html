<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구 및 보고서 작성 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --bg-grad:linear-gradient(135deg,#eef2ff 0%,#f5f7fb 50%,#fdf2f8 100%);
    --card:#ffffff;
    --text:#1f2937;
    --text-light:#4b5563;
    --muted:#6b7280;
    --primary:#4f46e5;
    --primary-dark:#3730a3;
    --primary-soft:#eef2ff;
    --accent:#ec4899;
    --border:#e5e7eb;
    --tag-bg:#eef2ff;
    --tag-text:#4338ca;
    --warn-bg:#fffbeb;
    --warn-border:#fbbf24;
    --warn-text:#92400e;
    --radius:14px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 4px 12px rgba(0,0,0,.06);
    --shadow-lg:0 10px 25px rgba(79,70,229,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg-grad);
    color:var(--text);
    line-height:1.7;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:960px;margin:0 auto;padding:48px 24px 80px}

  /* 헤더 */
  .page-header{margin-bottom:36px;padding-bottom:24px;border-bottom:2px solid var(--primary-soft)}
  .page-header h1{
    font-size:2.1rem;font-weight:900;color:var(--primary-dark);
    letter-spacing:-.02em;line-height:1.3;margin-bottom:8px;
  }
  .page-header .subtitle{color:var(--muted);font-size:1.05rem;font-weight:500}
  .breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:8px}
  .breadcrumb a{color:var(--primary);text-decoration:none}
  .breadcrumb a:hover{text-decoration:underline}

  /* 메인 네비 (단계 카드) */
  .step-list{display:grid;gap:14px;margin-top:8px}
  .step-card{
    display:flex;align-items:center;gap:18px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 24px;text-decoration:none;color:var(--text);
    box-shadow:var(--shadow-sm);transition:all .2s ease;
  }
  .step-card:hover{
    transform:translateY(-3px);border-color:var(--primary);
    box-shadow:var(--shadow-lg);
  }
  .step-num{
    flex-shrink:0;width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    color:#fff;font-weight:900;font-size:1.3rem;
    display:flex;align-items:center;justify-content:center;
  }
  .step-body strong{font-size:1.1rem;color:var(--primary-dark);display:block;margin-bottom:2px}
  .step-body span{color:var(--muted);font-size:.92rem}

  /* 카테고리 헤더 */
  .category-title{
    display:flex;align-items:center;gap:10px;
    font-size:1.25rem;font-weight:700;color:var(--primary-dark);
    margin:36px 0 16px;padding-bottom:8px;
    border-bottom:2px solid var(--primary-soft);
  }
  .category-title::before{
    content:"";width:6px;height:24px;border-radius:3px;
    background:linear-gradient(180deg,var(--primary),var(--accent));
  }
  .category-title:first-of-type{margin-top:16px}

  /* 사이트 카드 */
  .site-card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;
    box-shadow:var(--shadow-sm);transition:all .2s ease;
  }
  .site-card:hover{box-shadow:var(--shadow);border-color:#c7d2fe}
  .site-name{
    font-size:1.15rem;font-weight:700;margin-bottom:8px;
    display:inline-flex;align-items:center;gap:6px;
  }
  .site-name a{color:var(--primary-dark);text-decoration:none;border-bottom:2px solid transparent;transition:.15s}
  .site-name a:hover{border-bottom-color:var(--primary)}
  .site-name .ext{font-size:.85rem;opacity:.5}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{
    display:inline-block;background:var(--tag-bg);color:var(--tag-text);
    padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;
  }
  .desc{color:var(--text-light);margin-bottom:10px;font-size:.97rem}
  .items{
    margin:10px 0 0;padding:12px 0 0;
    border-top:1px dashed var(--border);
    list-style:none;
  }
  .items li{
    position:relative;padding:4px 0 4px 22px;
    color:var(--text-light);font-size:.93rem;
  }
  .items li::before{
    content:"▸";position:absolute;left:6px;top:4px;
    color:var(--primary);font-weight:700;
  }
  .warn{
    margin-top:12px;padding:10px 14px;
    background:var(--warn-bg);border-left:4px solid var(--warn-border);
    color:var(--warn-text);font-size:.9rem;border-radius:var(--radius-sm);
  }

  /* 서브 페이지 그리드/리스트 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:8px}
  .grid .btn{
    display:flex;align-items:center;justify-content:center;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:22px 16px;text-decoration:none;color:var(--text);
    font-weight:600;text-align:center;box-shadow:var(--shadow-sm);
    transition:all .2s ease;
  }
  .grid .btn:hover{
    transform:translateY(-3px);border-color:var(--primary);
    color:var(--primary-dark);box-shadow:var(--shadow-lg);
  }
  .menu-list{list-style:none;display:grid;gap:10px;margin-top:8px}
  .menu-list a{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px 20px;text-decoration:none;color:var(--text);
    font-weight:500;box-shadow:var(--shadow-sm);transition:all .2s;
  }
  .menu-list a:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateX(4px)}
  .menu-list a::after{content:"→";color:var(--muted);font-weight:700}
  .menu-list a:hover::after{color:var(--primary)}

  /* 뒤로가기 */
  .back{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:32px;padding:10px 18px;
    background:var(--primary-soft);color:var(--primary-dark);
    border-radius:var(--radius-sm);text-decoration:none;font-weight:600;
    transition:.15s;
  }
  .back:hover{background:var(--primary);color:#fff}

  /* stub & note */
  .note{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:24px;color:var(--text-light);
    box-shadow:var(--shadow-sm);
  }

  @media (max-width:600px){
    .container{padding:32px 16px 60px}
    .page-header h1{font-size:1.6rem}
    .step-card{padding:16px;gap:14px}
    .step-num{width:40px;height:40px;font-size:1.1rem}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<main class="container" id="app"></main>

const app = document.getElementById('app');

function header(title, sub, withCrumb){
  return `
    ${withCrumb ? `<div class="breadcrumb"><a href="#home">🏠 메인</a> &nbsp;/&nbsp; ${title}</div>` : ''}
    <div class="page-header">
      <h1>${title}</h1>
      ${sub ? `<p class="subtitle">${sub}</p>` : ''}
    </div>`;
}
function backBtn(){return `<a class="back" href="#home">⬅ 메인으로 돌아가기</a>`;}

function renderHome(){
  app.innerHTML = `
    ${header('생기부 주제 가이드','다음 다섯 단계를 통해 생기부를 채워보아요.', false)}
    <div class="step-list">
      <a class="step-card" href="#step1">
        <div class="step-num">1</div>
        <div class="step-body"><strong>주제 잡기</strong><span>어디에서 영감을 얻어볼까?</span></div>
      </a>
      <a class="step-card" href="#step2">
        <div class="step-num">2</div>
        <div class="step-body"><strong>자료조사 하기</strong><span>어디에서 어떻게 찾아야 할까?</span></div>
      </a>
      <a class="step-card" href="#step3">
        <div class="step-num">3</div>
        <div class="step-body"><strong>활동 계획하기</strong><span>어떤 활동을 할 수 있을까?</span></div>
      </a>
      <a class="step-card" href="#step4">
        <div class="step-num">4</div>
        <div class="step-body"><strong>최종보고서 작성하기</strong><span>실제로 해보기</span></div>
      </a>
      <a class="step-card" href="#step5">
        <div class="step-num">5</div>
        <div class="step-body"><strong>후속 활동 계획하기</strong><span>새로운 탐구로 이어가기</span></div>
      </a>
    </div>`;
}

function renderStep(key){
  const s = STEPS[key];
  let body = header(s.title, s.sub || '', true);
  if(s.grid){
    body += `<div class="grid">` + s.grid.map(([k,n])=>`<a class="btn" href="#${k}">${n}</a>`).join('') + `</div>`;
  } else if(s.list){
    body += `<ul class="menu-list">` + s.list.map(([k,n])=>`<li><a href="#${k}">${n}</a></li>`).join('') + `</ul>`;
  } else if(s.html){
    body += s.html;
  }
  body += backBtn();
  app.innerHTML = body;
}

function renderTopic(key){
  const t = DATA[key];
  if(!t) return renderHome();
  let html = header(t.title,'', true);
  t.groups.forEach(g=>{
    html += `<h2 class="category-title">${g.category}</h2>`;
    g.sites.forEach(s=>{
      html += `<article class="site-card">
        <div class="site-name"><a href="${s.url}" target="_blank" rel="noopener">${s.name}</a><span class="ext">↗</span></div>
        ${s.tags && s.tags.length ? `<div class="tags">${s.tags.map(x=>`<span class="tag">#${x}</span>`).join('')}</div>` : ''}
        <p class="desc">${s.desc||''}</p>
        ${s.items && s.items.length ? `<ul class="items">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>` : ''}
        ${s.warn ? `<div class="warn">⚠️ ${s.warn}</div>` : ''}
      </article>`;
    });
  });
  html += backBtn();
  app.innerHTML = html;
}

function renderStub(key){
  app.innerHTML = header(STUBS[key],'', true) +
    `<div class="note">여기에 ${STUBS[key]} 관련 상세 내용을 작성하세요.</div>` + backBtn();
}

function route(){
  const h = (location.hash || '#home').replace('#','');
  window.scrollTo(0,0);
  if(h==='home') return renderHome();
  if(STEPS[h]) return renderStep(h);
  if(DATA[h]) return renderTopic(h);
  if(STUBS[h]) return renderStub(h);
  renderHome();
}
window.addEventListener('hashchange', route);
