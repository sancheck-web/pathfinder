<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구 및 보고서 작성 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f7fb;
    --bg-grad:linear-gradient(135deg,#eef2ff 0%,#f5f7fb 50%,#fdf2f8 100%);
    --card:#ffffff;
    --text:#1f2937;
    --text-light:#4b5563;
    --muted:#6b7280;
    --primary:#4f46e5;
    --primary-dark:#3730a3;
    --primary-soft:#eef2ff;
    --accent:#ec4899;
    --border:#e5e7eb;
    --tag-bg:#eef2ff;
    --tag-text:#4338ca;
    --warn-bg:#fffbeb;
    --warn-border:#fbbf24;
    --warn-text:#92400e;
    --radius:14px;
    --radius-sm:8px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 4px 12px rgba(0,0,0,.06);
    --shadow-lg:0 10px 25px rgba(79,70,229,.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg-grad);
    color:var(--text);
    line-height:1.7;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .container{max-width:960px;margin:0 auto;padding:48px 24px 80px}
  .page-header{margin-bottom:36px;padding-bottom:24px;border-bottom:2px solid var(--primary-soft)}
  .page-header h1{font-size:2.1rem;font-weight:900;color:var(--primary-dark);letter-spacing:-.02em;line-height:1.3;margin-bottom:8px;}
  .page-header .subtitle{color:var(--muted);font-size:1.05rem;font-weight:500}
  .breadcrumb{font-size:.85rem;color:var(--muted);margin-bottom:8px}
  .breadcrumb a{color:var(--primary);text-decoration:none}
  .breadcrumb a:hover{text-decoration:underline}
  .step-list{display:grid;gap:14px;margin-top:8px}
  .step-card{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;text-decoration:none;color:var(--text);box-shadow:var(--shadow-sm);transition:all .2s ease;}
  .step-card:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--shadow-lg);}
  .step-num{flex-shrink:0;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:900;font-size:1.3rem;display:flex;align-items:center;justify-content:center;}
  .step-body strong{font-size:1.1rem;color:var(--primary-dark);display:block;margin-bottom:2px}
  .step-body span{color:var(--muted);font-size:.92rem}
  .category-title{display:flex;align-items:center;gap:10px;font-size:1.25rem;font-weight:700;color:var(--primary-dark);margin:36px 0 16px;padding-bottom:8px;border-bottom:2px solid var(--primary-soft);}
  .category-title::before{content:"";width:6px;height:24px;border-radius:3px;background:linear-gradient(180deg,var(--primary),var(--accent));}
  .category-title:first-of-type{margin-top:16px}
  .site-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow-sm);transition:all .2s ease;}
  .site-card:hover{box-shadow:var(--shadow);border-color:#c7d2fe}
  .site-name{font-size:1.15rem;font-weight:700;margin-bottom:8px;display:inline-flex;align-items:center;gap:6px;}
  .site-name a{color:var(--primary-dark);text-decoration:none;border-bottom:2px solid transparent;transition:.15s}
  .site-name a:hover{border-bottom-color:var(--primary)}
  .site-name .ext{font-size:.85rem;opacity:.5}
  .act-name{font-size:1.15rem;font-weight:700;margin-bottom:8px;color:var(--primary-dark);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .tag{display:inline-block;background:var(--tag-bg);color:var(--tag-text);padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;}
  .desc{color:var(--text-light);margin-bottom:10px;font-size:.97rem}
  .items{margin:10px 0 0;padding:12px 0 0;border-top:1px dashed var(--border);list-style:none;}
  .items li{position:relative;padding:4px 0 4px 22px;color:var(--text-light);font-size:.93rem;white-space:pre-line;}
  .items li::before{content:"▸";position:absolute;left:6px;top:4px;color:var(--primary);font-weight:700;}
  .warn{margin-top:12px;padding:10px 14px;background:var(--warn-bg);border-left:4px solid var(--warn-border);color:var(--warn-text);font-size:.9rem;border-radius:var(--radius-sm);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:8px}
  .grid .btn{display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 16px;text-decoration:none;color:var(--text);font-weight:600;text-align:center;box-shadow:var(--shadow-sm);transition:all .2s ease;}
  .grid .btn:hover{transform:translateY(-3px);border-color:var(--primary);color:var(--primary-dark);box-shadow:var(--shadow-lg);}
  .menu-list{list-style:none;display:grid;gap:10px;margin-top:8px}
  .menu-list a{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;text-decoration:none;color:var(--text);font-weight:500;box-shadow:var(--shadow-sm);transition:all .2s;}
  .menu-list a:hover{border-color:var(--primary);color:var(--primary-dark);transform:translateX(4px)}
  .menu-list a::after{content:"→";color:var(--muted);font-weight:700}
  .menu-list a:hover::after{color:var(--primary)}
  .back{display:inline-flex;align-items:center;gap:6px;margin-top:32px;padding:10px 18px;background:var(--primary-soft);color:var(--primary-dark);border-radius:var(--radius-sm);text-decoration:none;font-weight:600;transition:.15s;}
  .back:hover{background:var(--primary);color:#fff}
  .note{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;color:var(--text-light);box-shadow:var(--shadow-sm);}
  @media (max-width:600px){
    .container{padding:32px 16px 60px}
    .page-header h1{font-size:1.6rem}
    .step-card{padding:16px;gap:14px}
    .step-num{width:40px;height:40px;font-size:1.1rem}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<main class="container" id="app"></main>

        {"name":"활동 1 — 각 과목에 숨어 있는 철학 이론 찾기","items":["🙋 탐구 질문\n내가 공부하는 과목에는 어떤 철학적 가정이 깔려 있는가?\n이 철학적 이론은 어떤 시대적 배경에서 등장했는가?\n이 이론에 동의하는가? 어떤 부분이 설득력 있고 어떤 부분에 의문이 드는가?\n나의 주장을 뒷받침할 수 있는 근거는 무엇인가?","🗺️ 활동 절차\n패스파인더(주제 잡기)로 관심 과목과 연결된 철학 키워드 탐색\nRISS + 국립중앙도서관(nl.go.kr)에서 관련 철학 논문·도서 수집\n이론의 핵심 주장 정리\n자신의 의견을 논거와 함께 작성\n반론 예상 + 재반론 작성으로 에세이 완성","📌 2022 교육과정 연계 교과\n철학(선택) / 윤리와 사상 / 해당 교과목(수학·과학·국어 등)"]},
        {"name":"활동 2 — 언어철학·과학철학·수철학 탐구","items":["🙋 탐구 질문\n언어는 사고를 결정하는가, 사고가 언어를 결정하는가? (사피어-워프 가설)\n과학 지식은 어떻게 성장하는가? (쿤의 패러다임 vs 포퍼의 반증주의)\n수학적 진리는 발견되는 것인가, 발명되는 것인가?\n이 세 철학 분야는 서로 어떻게 연결되는가?","🗺️ 활동 절차\n패스파인더(자료조사)로 각 분야 기초 개념 탐색\nStanford Encyclopedia of Philosophy(plato.stanford.edu) 참고\nRISS + DBpia에서 한국어 논문 검색\n각 철학 분야 핵심 논쟁 정리\n가장 흥미로운 분야를 선택하여 심화 탐구 에세이 작성","📌 2022 교육과정 연계 교과\n철학(선택) / 언어와 매체 / 수학과 문화(선택) / 과학과 문화(선택)"]},
        {"name":"활동 3 ✨ — 동양 철학 vs 서양 철학","items":["🙋 탐구 질문\n유교·불교·도교에서 인간을 어떻게 이해하는가?\n아리스토텔레스·칸트·헤겔 등 서양 철학에서 인간과 이성을 어떻게 정의하는가?\n동서양 철학이 공통으로 다루는 문제와 차이점은 무엇인가?\n현대 사회의 문제(환경, 공동체, 개인의 자유)에 어느 철학이 더 유용한가?","🗺️ 활동 절차\n패스파인더로 비교 주제 설정\n동양 철학(유교 인의예지, 불교 연기론, 도가 무위) 핵심 개념 정리\n서양 철학(아리스토텔레스의 덕 윤리, 칸트의 의무론, 공리주의) 핵심 개념 정리\n비교표 작성 및 공통점·차이점 분석\n현대 사례에 적용한 철학 에세이 작성","📌 2022 교육과정 연계 교과\n윤리와 사상 / 동아시아사 / 세계사 / 철학(선택)"]},
        {"name":"활동 4 ✨ — 현대 사회의 윤리적 딜레마: AI·생명·환경 윤리","items":["🙋 탐구 질문\nAI가 인간의 일자리를 대체하는 것은 윤리적으로 허용될 수 있는가?\n안락사나 낙태 등 생명 윤리 문제에서 어떤 철학적 입장이 가장 설득력 있는가?\n공리주의 관점과 의무론 관점에서 환경 보호 의무를 어떻게 정당화하는가?\n나는 어떤 입장이며, 그 근거는 무엇인가?","🗺️ 활동 절차\n패스파인더로 관심 딜레마 선택\n빅카인즈에서 해당 주제 관련 시사 자료 수집\n공리주의(벤담·밀)·의무론(칸트)·덕 윤리(아리스토텔레스)의 관점에서 각각 분석\n자신의 입장 정리 + 반론 검토\n윤리 에세이 작성","📌 2022 교육과정 연계 교과\n생활과 윤리 / 철학(선택) / 사회·문화 / 통합사회"]},
        {"name":"활동 5 ✨ — 철학 고전 읽기: 플라톤·니체·노자","items":["🙋 탐구 질문\n이 책에서 저자가 핵심적으로 말하려는 것은 무엇인가?\n이 철학적 주장이 쓰인 시대적 배경은 무엇인가?\n이 주장은 현대 사회에서 어떤 의미를 갖는가?\n나는 이 주장에 동의하는가? 어떤 부분에 의문이 드는가?","🗺️ 활동 절차\n관심 철학 고전 선택 (교사 추천 목록 활용 가능)\n패스파인더로 해당 책의 시대적 배경 먼저 조사\n독서 — 핵심 개념·인상 깊은 구절·의문점을 독서 노트에 기록\n관련 해설서 또는 논문 참고 (RISS, 네이버 지식백과)","📌 2022 교육과정 연계 교과\n독서(선택) / 철학(선택) / 윤리와 사상"]}
      ]},
      {"category":"📖 국어국문 / 언어학","sites":[
        {"name":"활동 1 — 옛날 신문과 요즘 신문 비교: 언어의 사회성 탐구","items":["🙋 탐구 질문\n언어의 사회성이란 무엇인가?\n시대에 따라 어떤 어휘와 표현이 사라지고 새롭게 생겨났는가?\n언어의 변화는 어떤 사회적 변화를 반영하는가?\n언어의 변화가 사람들의 사고방식에도 영향을 미치는가?","🗺️ 활동 절차\n패스파인더(주제 잡기)에서 비교할 시대·주제 선정\n빅카인즈(bigkinds.or.kr)에서 같은 주제어로 1970~90년대 기사 & 최근 기사 각각 검색\n어휘·문장 구조·표현 방식 변화를 비교표로 정리\n변화의 원인(사회·문화적 맥락) 분석 — 국립국어원(korean.go.kr) 자료 참고\n'언어의 사회성' 개념과 연결하여 보고서 작성","📌 2022 교육과정 연계 교과\n언어와 매체 / 독서와 작문 / 사회·문화"]},
        {"name":"활동 2 — 고전문학 재해석: 내 손으로 새롭게 쓰기","items":["🙋 탐구 질문\n재해석된 작품에서 원작의 어떤 요소가 변형되었고, 왜 그렇게 바뀌었는가?\n'좋은 재해석'의 기준은 무엇인가?\n현대 독자에게 고전문학을 어떻게 흥미롭게 전달할 수 있는가?\n내가 선택한 재해석 방식은 원작의 어떤 가치를 살리고 있는가?","🗺️ 활동 절차\n패스파인더로 재해석할 고전 선택 (춘향전, 심청전, 홍길동전 등)\n원작 읽기 + 시대적 맥락·핵심 주제 정리\n현대 재해석 사례 조사 — 영화, 웹툰, 소설 등 (포털 검색 + RISS)\n우리 반 친구들의 관심사와 연결한 재해석 방향 구상\n짧은 재해석 작품(단편 소설, 웹툰 스토리보드, 대본 등) 창작 및 발표","📌 2022 교육과정 연계 교과\n문학 / 독서 / 국어"]},
        {"name":"활동 3 — 좋은 번역이란 무엇인가? 번역의 철학 탐구","items":["🙋 탐구 질문\n번역은 언어를 옮기는 것인가, 문화를 옮기는 것인가?\n같은 원문을 여러 번역가가 번역했을 때 어떤 차이가 생기는가?\n직역과 의역, 어느 쪽이 '좋은 번역'인가?\n번역 불가능한 고유 표현을 어떻게 처리해야 하는가?","🗺️ 활동 절차\n패스파인더(자료조사)에서 번역 관련 쟁점 파악\n동일 원문의 한국어 번역본 2~3가지 비교 (예: 셰익스피어 작품 번역본 비교)\n번역 투 언어, 외래어·고유명사 처리 방식 사례 조사\n'좋은 번역의 기준' 자신만의 정의 도출\n짧은 영어 지문을 직접 번역하고 번역 과정과 선택 이유를 해설문으로 작성","📌 2022 교육과정 연계 교과\n언어와 매체 / 영어 독해와 작문 / 영어 문학(선택)"]},
        {"name":"활동 4 — 인공지능에 사용되는 언어학적 지식 살펴보기","items":["🙋 탐구 질문\n자연어 처리(NLP)란 무엇이며, 어떤 언어학 개념이 활용되는가?\nAI가 언어를 이해하는 방식은 인간과 어떻게 다른가?\nAI 번역기(파파고, 구글 번역)는 왜 아직도 완벽하지 않은가?\n챗GPT 같은 언어 모델은 언어를 '이해'한다고 볼 수 있는가?","🗺️ 활동 절차\n패스파인더(자료조사)로 자연어 처리(NLP) 기초 개념 탐색\n구문론·의미론·화용론 등 언어학 기초 개념 정리 — 국립국어원 온라인 자료 활용\nAI 번역 오류 사례 직접 수집 및 원인 분석\n한국어의 특수성(교착어, 존댓말 체계 등)이 AI 처리에서 어떤 어려움을 낳는지 분석\n탐구 보고서 작성 및 발표","📌 2022 교육과정 연계 교과\n언어와 매체 / 정보(선택) / 인공지능 기초(선택)"]},
        {"name":"활동 5 ✨ — 방언과 표준어: 지역 방언이 가진 문화적 가치 탐구","items":["🙋 탐구 질문\n방언은 표준어보다 열등한 언어인가? 방언의 언어학적 가치는 무엇인가?\n방언이 소멸되어 가는 이유는 무엇인가?\n방언은 그 지역의 문화·역사와 어떻게 연결되어 있는가?\n방언 보존을 위한 노력에는 어떤 것들이 있는가?","🗺️ 활동 절차\n패스파인더로 관심 있는 지역 방언 선택 (제주어, 경상도 방언, 전라도 방언 등)\n국립국어원(korean.go.kr) — 방언 사전·방언 지도 자료 수집\n해당 방언의 음운·어휘적 특징 정리\n방언 사용자 인터뷰 or 방언 관련 영상 자료(유튜브, 다큐멘터리) 분석\n방언의 문화적 가치와 보존 방안에 관한 보고서 작성","📌 2022 교육과정 연계 교과\n언어와 매체 / 한국어 탐구(선택) / 사회·문화"]}

      {"category":"🏺 사학","sites":[
        {"name":"활동 1 — 고대 사회와 현대 민주주의의 인재상 비교","items":["🙋 탐구 질문\n고대 그리스·조선·중국의 교육기관은 어떤 인재를 길러내려 했는가?\n현대 민주주의 사회에서 요구하는 인재상은 무엇인가?\n교육 목표의 변화는 사회 구조의 변화와 어떻게 연결되는가?\n현재 우리 학교 교육은 어떤 인재상을 지향하고 있는가?","🗺️ 활동 절차\n패스파인더(주제 잡기)로 비교할 시대·사회 선정\n고대 교육기관 자료 조사 — 서울대 규장각(kyu.snu.ac.kr), 한국사데이터베이스(db.history.go.kr)\n현대 교육과정 문서 조사 — 교육부(moe.go.kr) 2022 교육과정 총론 열람\n인재상 비교표 작성\n내가 생각하는 바람직한 인재상 논거와 함께 서술","📌 2022 교육과정 연계 교과\n역사 / 동아시아사 / 세계사 / 통합사회"]},

        {"name":"활동 3 — 인플레이션과 금리: 경제 지표로 내 일상 물가 이해하기","items":["🙋 탐구 질문\n인플레이션이란 무엇이며, 어떤 원인으로 발생하는가?\n중앙은행(한국은행)이 금리를 올리면 왜 인플레이션이 잡히는가?\n금리 변화가 우리의 일상(대출, 예금, 소비)에 어떤 영향을 미치는가?\n최근 한국의 물가 및 금리 변화를 데이터로 분석하면 어떤 패턴이 보이는가?","🗺️ 활동 절차\n패스파인더로 거시경제 지표 자료 탐색\n한국은행 경제통계시스템(ecos.bok.or.kr) — 물가·금리·환율 데이터 수집\n통계청 소비자물가지수 데이터 분석\n그래프·표로 데이터 시각화\n'내 지갑과 거시경제의 연결고리' 탐구 보고서 작성","📌 2022 교육과정 연계 교과\n경제 / 수학(통계) / 사회·문화"]}
      ]}
    ]
  }
};

/* =============================================================
   렌더링 함수
   ============================================================= */
const app = document.getElementById('app');

function header(title, sub, withCrumb) {
  return `
    ${withCrumb ? `<div class="breadcrumb"><a href="#home">🏠 메인</a> &nbsp;/&nbsp; ${title}</div>` : ''}
    <div class="page-header">
      <h1>${title}</h1>
      ${sub ? `<p class="subtitle">${sub}</p>` : ''}
    </div>`;
}

function backBtn() {
  return `<a class="back" href="#home">⬅ 메인으로 돌아가기</a>`;
}

/* 외부 링크 있는 카드 */
function renderSiteCard(s) {
  return `<article class="site-card">
    <div class="site-name">
      <a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>
      <span class="ext">↗</span>
    </div>
    ${s.tags && s.tags.length ? `<div class="tags">${s.tags.map(x => `<span class="tag">#${x}</span>`).join('')}</div>` : ''}
    <p class="desc">${s.desc || ''}</p>
    ${s.items && s.items.length ? `<ul class="items">${s.items.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
    ${s.warn ? `<div class="warn">⚠️ ${s.warn}</div>` : ''}
  </article>`;
}

/* 활동 카드 — 외부 링크 없음 */
function renderActCard(s) {
  return `<article class="site-card">
    <div class="act-name">${s.name}</div>
    ${s.items && s.items.length ? `<ul class="items">${s.items.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
  </article>`;
}

function renderHome() {
  app.innerHTML = `
    ${header('생기부 주제 가이드', '다음 다섯 단계를 통해 생기부를 채워보아요.', false)}
    <div class="step-list">
      <a class="step-card" href="#step1">
        <div class="step-num">1</div>
        <div class="step-body"><strong>주제 잡기</strong><span>어디에서 영감을 얻어볼까?</span></div>
      </a>
      <a class="step-card" href="#step2">
        <div class="step-num">2</div>
        <div class="step-body"><strong>자료조사 하기</strong><span>어디에서 어떻게 찾아야 할까?</span></div>
      </a>
      <a class="step-card" href="#step3">
        <div class="step-num">3</div>
        <div class="step-body"><strong>활동 계획하기</strong><span>어떤 활동을 할 수 있을까?</span></div>
      </a>
      <a class="step-card" href="#step4">
        <div class="step-num">4</div>
        <div class="step-body"><strong>최종보고서 작성하기</strong><span>실제로 해보기</span></div>
      </a>
      <a class="step-card" href="#step5">
        <div class="step-num">5</div>
        <div class="step-body"><strong>후속 활동 계획하기</strong><span>새로운 탐구로 이어가기</span></div>
      </a>
    </div>`;
}

function renderStep(key) {
  const s = STEPS[key];
  let body = header(s.title, s.sub || '', true);
  if (s.grid) {
    body += `<div class="grid">` + s.grid.map(([k, n]) => `<a class="btn" href="#${k}">${n}</a>`).join('') + `</div>`;
  } else if (s.list) {
    body += `<ul class="menu-list">` + s.list.map(([k, n]) => `<li><a href="#${k}">${n}</a></li>`).join('') + `</ul>`;
  } else if (s.html) {
    body += s.html;
  }
  body += backBtn();
  app.innerHTML = body;
}

/* DATA 렌더러 (주제 잡기 + 자료조사) */
function renderTopic(key) {
  const t = DATA[key];
  if (!t) return renderHome();
  let html = header(t.title, '', true);
  t.groups.forEach(g => {
    html += `<h2 class="category-title">${g.category}</h2>`;
    g.sites.forEach(s => { html += renderSiteCard(s); });
  });
  html += backBtn();
  app.innerHTML = html;
}

/* ACTS 렌더러 (활동 계획하기) */
function renderAct(key) {
  const t = ACTS[key];
  if (!t) return renderHome();
  let html = header(t.title, '', true);
  t.groups.forEach(g => {
    html += `<h2 class="category-title">${g.category}</h2>`;
    g.sites.forEach(s => { html += renderActCard(s); });
  });
  html += backBtn();
  app.innerHTML = html;
}

/* STUBS 렌더러 (보고서 섹션 준비 중) */
function renderStub(key) {
  app.innerHTML = header(STUBS[key], '', true) +
    `<div class="note">해당 콘텐츠는 준비 중입니다.</div>` + backBtn();
}

/* =============================================================
   라우터 — act_* 키를 ACTS에서 렌더링
   ============================================================= */
function route() {
  const h = (location.hash || '#home').replace('#', '');
  window.scrollTo(0, 0);
  if (h === 'home') return renderHome();
  if (STEPS[h]) return renderStep(h);
  if (ACTS[h]) return renderAct(h);
  if (DATA[h]) return renderTopic(h);
  if (STUBS[h]) return renderStub(h);
  renderHome();
}

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', route);
</script>
</body>
</html>
